<!DOCTYPE html>
<html class="theme-light" lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page Title -->
    <title>TheOutEdit | Outside, Edited</title>
    <link rel="icon" type="image/x-icon" href="images/avatar.png">

    <!-- Meta Description & SEO -->
    <meta name="description" content="TheOutEdit creates outdoor-inspired everyday essentials designed for comfort, versatility, and effortless style — made for weekends, sunny days, and life outside.">
    <meta name="keywords" content="Hat, Outdoor, Sports, Apparel, TheOutEdit">
    <link rel="canonical" href="https://theoutedit.com">
    <meta name="author" content="TheOutEdit">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">
    <link rel="stylesheet" href="css/brands-extended.css">

    <!-- Fallback Brand Colors (确保即使 CSS 缺少也能正确显示对应品牌色) -->
    <style>
      .button-facebook {
        background-color: #1877F2 !important;
        color: #ffffff !important;
      }
      .button-facebook:hover,
      .button-facebook:focus {
        background-color: #166fe5 !important;
        color: #ffffff !important;
      }
      .button-messenger {
        background-color: #00B2FF !important;
        color: #ffffff !important;
      }
      .button-messenger:hover,
      .button-messenger:focus {
        background-color: #0099db !important;
        color: #ffffff !important;
      }
    </style>
  </head>

<body>

    <div class="container">
        <div class="column">

            <!-- Brand Avatar -->
            <img class="avatar avatar--rounded" src="images/avatar.png" srcset="images/avatar@2x.png 2x" alt="TheOutEdit Logo">

            <!-- Brand Name -->
            <h1>
              <div>TheOutEdit</div>
            </h1>

            <!-- Brand Slogan / Bio -->
            <p>Outside, Edited.<br>Adventure Looks Good on You.</p>

            <!-- Links Stack -->
            <div class="button-stack" role="navigation">

              <!-- Official Website -->
              <a class="button button-default" href="https://theoutedit.com" target="_blank" rel="noopener" role="button">
                <img class="icon" aria-hidden="true" src="images/icons/generic-website.svg" alt="Website Icon">Official Website
              </a>
              
              <!-- Shop Men -->
              <a class="button button-default" href="https://theoutedit.com/collections/men" target="_blank" rel="noopener" role="button">
                <img class="icon" aria-hidden="true" src="images/icons/generic-shopping-bag.svg" alt="Shopping Bag Icon">Shop Men
              </a>

              <!-- Shop Women -->
              <a class="button button-default" href="https://theoutedit.com/collections/women" target="_blank" rel="noopener" role="button">
                <img class="icon" aria-hidden="true" src="images/icons/generic-shopping-bag.svg" alt="Shopping Bag Icon">Shop Women
              </a>

              <!-- Facebook -->
              <a class="button button-facebook" href="https://www.facebook.com/TheOutEdit" target="_blank" rel="noopener" role="button">
                <img class="icon" aria-hidden="true" src="images/icons/facebook.svg" alt="Facebook Logo">Facebook
              </a>

              <!-- Instagram -->
              <a class="button button-instagram" href="https://www.instagram.com/the_outedit/" target="_blank" rel="noopener" role="button">
                <img class="icon" aria-hidden="true" src="images/icons/instagram.svg" alt="Instagram Logo">Instagram
              </a>

              <!-- Threads -->
              <a class="button button-threads" href="https://www.threads.net/@the_outedit" target="_blank" rel="noopener" role="button">
                <img class="icon" aria-hidden="true" src="images/icons/threads.svg" alt="Threads Logo">Threads
              </a>

              <!-- TikTok -->
              <a class="button button-tiktok" href="https://www.tiktok.com/@theoutedit" target="_blank" rel="noopener" role="button">
                <img class="icon" aria-hidden="true" src="images/icons/tiktok.svg" alt="TikTok Logo">TikTok
              </a>

              <!-- Email -->
              <a class="button button-default" href="mailto:support@theoutedit.com" target="_blank" rel="noopener" role="button">
                <img class="icon" aria-hidden="true" src="images/icons/generic-email.svg" alt="Email Icon">Email Us
              </a>
              
              <!-- Facebook Messenger -->
              <a class="button button-messenger" href="https://m.me/1046494608557717" target="_blank" rel="noopener" role="button">
                <img class="icon" aria-hidden="true" src="images/icons/messenger.svg" alt="Messenger Logo">Chat on Messenger
              </a>

            </div>

            <!-- Footer -->
            <footer>
              Powered by <a href="https://theoutedit.com" target="_blank" rel="noopener">TheOutEdit</a>
            </footer>

        </div>
    </div>

</body>
</html>
